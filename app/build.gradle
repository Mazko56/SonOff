plugins { id 'com.android.application' }
android {
    namespace 'com.mazko.sonoffs60'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mazko.sonoffs60'
        minSdk 26
        targetSdk 35
        versionCode 200
        versionName '2.0.0-clean-gateway'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}
