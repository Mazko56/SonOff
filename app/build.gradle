plugins { id 'com.android.application' }
android {
    namespace 'com.mazko.sonoffs60'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mazko.sonoffs60'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0-lan-lab'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}
